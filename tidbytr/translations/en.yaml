configuration:
  display_base_url:
    name: HDK Display Base URL
    description: LAN URL for the read-only WebP feed, such as http://homeassistant.local:8788.
  timezone:
    name: Timezone
    description: IANA timezone used by the scheduler.
  latitude:
    name: Latitude
    description: Home latitude for NWS weather.
  longitude:
    name: Longitude
    description: Home longitude for NWS weather.
  nws_contact:
    name: NWS Contact
    description: Contact string used as the NWS User-Agent.
network:
  8787/tcp: Tidbytr dashboard (not required when using Ingress)
  8788/tcp: Read-only HDK WebP feed for Tidbyt firmware polling
