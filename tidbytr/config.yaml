name: Tidbytr
version: 0.10.1
slug: tidbytr
description: Tidbyt stock-firmware app with priority weather, sports, and manual controls.
url: https://github.com/dteske25/tidbytr
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8787
panel_icon: mdi:led-strip
ports:
  8787/tcp: null
ports_description:
  8787/tcp: Tidbytr dashboard (not required when using Ingress)
options:
  tidbyt_api_token: ""
  tidbyt_device_id: ""
  installation_id: tidbytrmain
  timezone: America/Chicago
  latitude: 39.0997
  longitude: -94.5786
  nws_contact: tidbytr@example.local
  favorite_teams: []
  children: []
  starfield_enabled: true
  schedule_mode: clock-cycle
  clock_seconds: 30
  screen_seconds: 15
  log_level: info
  scheduler_interval_seconds: 60
  refresh_interval_seconds: 600
  quiet_hours_start: ""
  quiet_hours_end: ""
schema:
  tidbyt_api_token: password
  tidbyt_device_id: str
  installation_id: match(^[A-Za-z0-9]+$)
  timezone: str
  latitude: float
  longitude: float
  nws_contact: str
  favorite_teams:
    - str
  children:
    - name: str
      birth_date: str
      style: list(boy|girl|neutral)
      id: str?
  baby_birth_date: str?
  baby_name: str?
  starfield_enabled: bool
  schedule_mode: list(clock-cycle|priority)
  clock_seconds: int(20,3600)
  screen_seconds: int(10,120)
  log_level: list(trace|debug|info|warn|error)
  scheduler_interval_seconds: int(15,3600)
  refresh_interval_seconds: int(60,21600)
  quiet_hours_start: str?
  quiet_hours_end: str?
