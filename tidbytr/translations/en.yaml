configuration:
  tidbyt_api_token:
    name: Tidbyt API Token
    description: API key from the device settings in the Tidbyt mobile app.
  tidbyt_device_id:
    name: Tidbyt Device ID
    description: Device ID from the same device settings.
  installation_id:
    name: Installation ID
    description: Stable alphanumeric ID for Tidbytr in your app rotation. Keep it unchanged.
  baby_birth_date:
    name: Baby birth date
    description: YYYY-MM-DD. Leave empty to disable the baby-age screen.
  baby_name:
    name: Baby name
    description: Optional name shown on the age screen.
  starfield_enabled:
    name: Star flight
    description: Include the flying-through-stars animation in Tidbytr selections.
  schedule_mode:
    name: Scheduling mode
    description: Clock-led cycle alternates longer clock slots with weather, baby age, and stars. Priority mode uses priorities/cooldowns.
  clock_seconds:
    name: Clock duration
    description: Clock-led cycle clock slot, longer than other-screen duration.
  screen_seconds:
    name: Other screen duration
    description: Weather, baby-age, and starfield slot duration in the clock-led cycle.
  timezone:
    name: Timezone
    description: IANA timezone used by the scheduler.
  latitude:
    name: Latitude
    description: Home latitude for NWS weather.
  longitude:
    name: Longitude
    description: Home longitude for NWS weather.
  nws_contact:
    name: NWS Contact
    description: Contact string used as the NWS User-Agent.
network:
  8787/tcp: Tidbytr dashboard (not required when using Ingress)
